<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VMOOD Order Confirmed</title>
  <link rel="stylesheet" href="thankyou.css">
</head>
<body>
<header class="thankyou-header">
  <img src="../VMOODICON.png" alt="VMOOD Logo" class="thankyou-logo">
  <a href="../index.html" class="home-btn">Home</a>
</header>

<section class="thankyou-page">
  <h1>ORDER CONFIRMED</h1>
  <img class="thankyou-vero" src="VEROTRUST.png" alt="VERO">

  <div class="thankyou-card">
    <h2>Thank You, <span id="customerName"></span></h2>
    <p>Your VMOOD order is welcomed into the VMOOD family.</p>
    <p><strong>Order ID:</strong> <span class="order-id" id="orderId"></span></p>
    <p><strong>Payment Status:</strong> <span class="payment-confirmed">PAID</span></p>
    <p id="thankyouMessage">Your payment has been verified.</p>
    <p>Your order is now being prepared with care.</p>
    <p>You are part of VMOOD family.</p>
    <p>Care • Comfort • Trust</p>
  </div>
</section>

<script src="thankyou.js?v=2"></script>
</body>
</html>
