<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Tracking | VMOOD</title>
  <link rel="stylesheet" href="ordertracking.css">
</head>
<body>

  <header>
    <img src="../VMOODICON.png" alt="VMOOD Logo">
  </header>

  <main>
    <section class="tracking-card">
      <p class="eyebrow">VMOOD ORDER</p>
      <img src="VEROSUPPORT.png" class="tracking-vero" alt="VERO">
      <h1>Order Tracking</h1> 
      <p class="intro">Enter your Order ID and mobile number to track your VMOOD order.</p>
      <input type="text" id="orderId" placeholder="Order ID">
      <input type="tel" id="phone" placeholder="Mobile Number">

      <button onclick="trackOrder()">TRACK ORDER</button>
      <div id="result" class="result"></div>
      <a href="../index.html" class="home-btn">RETURN TO HOME</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ordertracking.js?v=5"></script>
</body>
  </html>
