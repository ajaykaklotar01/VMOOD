<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F6F3EE">
  <title>VMOOD — Ivory Theme Preview Only</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #F6F3EE; }
    #homepagePreview { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #F6F3EE; }
    #previewNote {
      position: fixed; z-index: 100000; top: 9px; left: 50%; transform: translateX(-50%);
      padding: 6px 11px; border: 1px solid rgba(138,154,135,.8); border-radius: 2px;
      color: #111111; background: rgba(246,243,238,.94);
      font: 10px Arial, sans-serif; letter-spacing: 1px; white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <iframe id="homepagePreview" src="index.html" title="VMOOD ivory theme homepage preview"></iframe>
  <div id="previewNote">IVORY THEME · PREVIEW ONLY · LIVE SITE UNCHANGED</div>
  <script>
    const frame = document.getElementById("homepagePreview");

    frame.addEventListener("load", () => {
      try {
        const doc = frame.contentDocument;
        const previewStyle = doc.createElement("style");
        previewStyle.id = "vmood-ivory-preview-theme";
        previewStyle.textContent = `
          :root { color-scheme: light; }
          html, body {
            background: #F6F3EE !important;
            color: #111111 !important;
          }
          body { min-height: 100vh; }
          .site-header {
            background: #F6F3EE !important;
            border-bottom: 1px solid #DED8CE !important;
          }
          .logo img, .footer-logo {
            filter: brightness(0) saturate(100%) !important;
          }
          nav a, .menu-btn { color: #111111 !important; }
          section {
            background: #F6F3EE !important;
            border-bottom: 1px solid #DED8CE !important;
            opacity: 1 !important;
            transform: none !important;
          }
          h1, h2, h3, .value-line, .value-line span {
            color: #111111 !important;
          }
          p { color: #49443D !important; }
          .eyebrow { color: #788775 !important; }
          .buttons a, .section-btn, .home-product-card .card-link {
            background: #8A9A87 !important;
            color: #111111 !important;
            border: 1px solid #8A9A87 !important;
          }
          .buttons a:first-child { background: #8A9A87 !important; color: #111111 !important; }
          .home-product-card {
            background: #FBF9F5 !important;
            border: 1px solid #DED8CE !important;
          }
          .home-product-card h3, .home-product-card .card-price {
            color: #111111 !important;
          }
          .home-product-card .card-old-price { color: #817A70 !important; }
          .home-product-card .card-offer {
            background: #8A9A87 !important; color: #111111 !important;
          }
          .home-product-card .card-badge {
            color: #586653 !important;
            border-color: rgba(138,154,135,.75) !important;
          }
          .stars { color: #71846D !important; }
          .stars .half {
            background: linear-gradient(to right, #71846D 50%, #D8D2C8 50%) !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
          }
          .review-card {
            background: #FBF9F5 !important;
            border: 1px solid #DED8CE !important;
            opacity: 1 !important;
            transform: none !important;
          }
          .review-card h3 { color: #111111 !important; }
          .review-card p { color: #49443D !important; }
          footer {
            background: #F6F3EE !important;
            border-top: 1px solid #DED8CE !important;
          }
          .footer-tagline, .footer-social-links a, .footer-action-links a,
          .footer-location, .footer-copy {
            color: #33302B !important;
          }
          .side-menu {
            background: #F6F3EE !important;
            border-left: 1px solid #8A9A87 !important;
          }
          .side-menu a, .close-menu { color: #111111 !important; }
          .side-menu a { border-bottom-color: #DED8CE !important; }
          .menu-overlay { background: rgba(17,17,17,.25) !important; }
          .hero-slider, .world-slider, .why-slider { background: #E8E2D8 !important; }
          #vmoodIntro { display: none !important; }
          html.vmood-intro-pending #vmoodIntro { display: none !important; }
          a, button { pointer-events: none !important; cursor: default !important; }
          * { -webkit-tap-highlight-color: transparent; }
        `;
        doc.head.appendChild(previewStyle);
        const intro = doc.getElementById("vmoodIntro");
        if (intro) intro.hidden = true;
        doc.documentElement.classList.remove("vmood-intro-pending");
      } catch (error) {
        document.getElementById("previewNote").textContent = "PREVIEW COULD NOT APPLY THEME";
      }
    }, { once: true });
  </script>
</body>
</html>
